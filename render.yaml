services:
  # Backend API
  - type: web
    name: doan-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromEnvVar: MONGODB_URI # We will set this in the Render Dashboard for security
      - key: JWT_SECRET
        generateValue: true # Generate a random secret if not provided
      - key: PORT
        value: 5000

  # Frontend Web
  - type: web
    name: doan-web
    env: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromContext:
          service: doan-api
          property: host
        # This will automatically point to your backend service URL
      - key: NODE_ENV
        value: production

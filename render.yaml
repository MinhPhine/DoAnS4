services:
  # Backend API
  - type: web
    name: doan-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # This will let you enter the value manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # Frontend Web
  - type: web
    name: doan-web
    env: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: doan-api
          property: host
      - key: NODE_ENV
        value: production
